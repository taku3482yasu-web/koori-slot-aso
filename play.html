摩天楼のことに詳しく、階の案内をしてくれる。
戦闘力は貧弱。

実家が太いとのうわさがあり、若干周りを下に見ている節がある。`},tomoishi:{title:"こおりくんのお母さん",text:`こおりくんをとても愛している。

口ぐせは「こおりなにしよっと！」。`},okagappa:{title:"丘に上がったカッパ",text:`丘に進出したカッパ。チーム5DX のリーダー。
ＤＪをしており、山グッチのおかピポとして名も知られている。

必殺技は「おかピポっと光線」。`},hibikimakuri:{title:"響きを伝える妖怪",text:`はるか昔から伝わる古典妖怪。
広い部屋などで声や物音が響いたりするのはこいつのせい。

必殺技は「大音響4DX」。`},yamamou:{title:"牛にあこがれる青年",text:`チーム5DX のメンバー。
牛にあこがれていて、どんなときも牛へのリスペクトを欠かさない。

必殺技は「おちょくりボーンフィーバー」。`},asahara:{title:"CS城の主",text:`チームASK-3 のリーダーで、CS城の主。SE城の主おにおにとはライバル。

優秀な策略家でもあり、優秀な者を仲間に引き入れたり、敵を欺いたりするのが得意。これまで陥落させた城は数知れない。

クリップボードをいつも持っている。

愛妻家で、妻にプレゼントする黄金のネックレスを手に入れるために摩天楼に来た。
必殺技は「マッスルウエノクラッシュ」。`},ikekimu:{title:"アイドル兼盗賊",text:`表の顔はアイドルユニット「out my back mans」のメンバー。

パニックになると、よくわからない言葉を口にすることがある。
必殺技は「イケキムドライブ」。`},harry:{title:"縄張りのハリネズミ",text:`摩天楼に住み着いたハリネズミ。

摩天楼に住み着いた敵の中でいちばん強い。

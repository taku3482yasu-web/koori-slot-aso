石の川にあった石が急激に冷えたことで生まれた。
その際に誰かの大腸炎が体の中に潜り込んでしまったため、大腸炎と共生している。毎日の大腸炎とのおしゃべりは欠かさない。

おにおにに借りたお金が返せず、パンツを見せる危機に。財宝を手に入れて借金を返すため、仲間を連れて ASO摩天楼に挑む。

内定はまだない。`},onioni:{title:"SE城の主",text:`遠賀川近辺を支配する鬼で、SE城の主。
睡眠時間は１日１７時間と、鬼としては規則正しい生活をしている。

こおりくんに貸した３万６千円を返してもらうまで、見張りとして摩天楼についてきた。
CS城の主 KING.ASAHARA とは長年のライバル。

こおりくんの顔はむかつくが、いざというときは誰よりも頼りになる。`},yasu:{title:"やすです。",text:`そこら辺をうろついていた一般人。

こおりくんに急にじゃんけんを挑まれて負けたため、摩天楼についていくことになった。
必殺技は「やすパンチ」。`},tamu:{title:"たむです。",text:`音ゲーをしていた一般人。

前にこおりくんを音ゲー勝負でぼこぼこにして泣かせたことがある。
今回は「面白そうやし、暇つぶしにもなるでしょ」と摩天楼についてきた。
必殺技は「たむキック」。`},dake:{title:"だけです。",text:`鍛えていた一般人。
世間という荒波にのまれた結果、肉体改造を施し、今の身体になった。

鍛えた地獄耳でこおりくんの話を聞きつけ、摩天楼についてきた。
必殺技は鍛え上げたこぶしの「だけチョップ」。`},furukawa:{title:"みんなを見守る妖精の類",text:`小さな妖精。こおりくんをサポートしている。
摩天楼のことに詳しく、階の案内をしてくれる。
戦闘力は貧弱。

実家が太いとのうわさがあり、若干周りを下に見ている節がある。`},tomoishi:{title:"こおりくんのお母さん",text:`こおりくんをとても愛している。

しかし、こおりくんが内定を持っていなかったり、人のお金を返さなかったりするので、いつも心配している。
口ぐせは「こおりなにしよっと！」。`},okagappa:{title:"丘に上がったカッパ",text:`丘に進出したカッパ。チーム5DX のリーダー。
ＤＪをしており、山グッチのおかピポとして名も知られている。

ノリと勢いで生きており、お宝を狙ってノリで摩天楼に来た。
必殺技は「おかピポっと光線」。`},hibikimakuri:{title:"響きを伝える妖怪",text:`はるか昔から伝わる古典妖怪。
広い部屋などで声や物音が響いたりするのはこいつのせい。

最近は４ＤＸにはまっており、摩天楼はよく響くのでお気に入り。

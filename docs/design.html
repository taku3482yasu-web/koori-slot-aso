# 画面設計書 ― こおりくんの大冒険～最凶のASO摩天楼への挑戦～

版: v0.4（2026-10-20）
キャラクターは [キャラ設計書](characters.md) にまとめています。
絵つきで読むときは `docs/design.html` を開いてください（作り直しは `node tools/build-design.mjs`）。

- 「決定」：ユーザーが指定したもの
- 「仕様書」：内部処理の仕様書（AT機 仕様書 v0.1・2026-10-20 更新版）で決まっていること
- 「案」：Claude の仮の案です。直してください
- 「内部」：内部処理（logic）が抽選・決定し、イベントで演出側に伝えるもの

**演出と内部処理の分け方**：
- どの演出を出すか（期待度に関わるもの）は**内部処理**が抽選し、イベントで伝えます。
- 画面・動き・音は、演出側がそのイベントを受けて作ります。
- イベント名はこの書類では仮のもので、正式な一覧は docs/events.md にまとめます。

**画面イメージについて**：
- 案：演出を作るときの見本として、Claude が描いた仮の絵です。
- 文字・数字は例で、色や配置を直したいときは教えてください。
- 液晶は 320×180 ドット（16:9）で描いています。

**v0.4 で足したこと**（仕様書の更新に合わせた）：
- リールにこおりくん図柄、レア役の停止形、入賞ライン（2章）
- 天国の 0G・50G 煽り、ガセ前兆からの昇格、天井は BIG 確定（3章）
- ボーナスのゲーム数、「こおりを狙え」カットイン、1G連の振り分け（4章）
- AT の継続演出、ストックの放出の順番、上乗せなし（5章）
- 特化ゾーンの「復活」、+5G、ストック（6章）

---

## 1. 筐体（決定）

- **デザイン**：氷と黒い摩天楼をかたどった台。
- **液晶**：大きめ。
- **PUSH ボタン**：丸い形。激熱のときは飛び出したり、色がついたりします。

```mock
cabinet 筐体の全体：上が黒い摩天楼の形、ふちに氷。液晶（大きめ）→ リール → クレジット表示 → MAX BET・レバー・PUSH・停止ボタン
```

- 内部：PUSH ボタンの状態（通常・色つき・飛び出し）は内部処理が決めます。

```mock
buttons PUSH ボタンの状態：通常・青・赤・金・虹。激熱のときは飛び出す
```

- 案：パソコンは Space か B キー、スマホは画面の丸いボタンを PUSH にします。

---

## 2. リール

### 2-1. 図柄

前作のこおりくんスロットの絵柄をもとに作ります。前作のダイヤは使いません。

```mock
reel-symbols リールの図柄（リプレイは青い丸に REP、こおりくんは告知専用）
```

| 図柄 | 絵柄 | 役目 |
|---|---|---|
| 7 | 前作と同じ赤い 7 | ボーナス入賞用（BIG 7・7・7、REG 7・7・BAR） |
| BAR | 前作と同じ BAR | ボーナス入賞用（エピソードBIG BAR・BAR・BAR） |
| こおりくん | 案：氷色の丸にこおりくん | 仕様書：**払い出しのない告知専用の図柄**。ボーナス中の AT 当選（AT 中のボーナスでは特化ゾーン当選）を、こおりくん揃いで知らせる |
| ベル | 前作と同じベル | AT 中の押し順ベル（純増） |
| リプレイ | 決定：**青い丸に「REP」の文字** | |
| チェリー | 前作と同じチェリー | 左リールだけにある |
| スイカ | 前作と同じスイカの切り身 | |

- 仕様書：絵柄のデザインは演出、配列・止まる位置は内部処理が受け持ちます。

### 2-2. リールの止まり方（仕様書）

- **目押しはいりません**。当たった役は必ず引き込むので（取りこぼしなし）、目押しが苦手な人でも全部の演出が見られます。
- 押した位置に近いところで止まります。実際の滑りは数コマで、中・右リールは最大 10コマ滑ります。
- **入賞ラインは中段 1本**です（ボーナス図柄とこおりくん揃い）。
- 押し順ベルあり（ナビあり。ナビなしで押し順をまちがえると取りこぼす）。
- リール配列は v1.0（各 21コマ）。配列の表は仕様書を見てください。

### 2-3. レア役の停止形（仕様書：液晶ではなく出目で見せる）

「ボーナス図柄」は BAR・7・こおりくんのどれかです。左リールはどこを狙っても同じ形になります。

```mock
deme レア役の停止形（黄色が見どころ。リール配列 v1.0 で作った出目の例）
```

| 役 | 左リール（上段／中段／下段） | 中・右リール | 振り分け |
|---|---|---|---|
| 弱チェリー | リプレイ／ボーナス図柄／**チェリー**（下段チェリー） | 右リール中段にリプレイかベル | 100% |
| 強チェリー | リプレイ／ボーナス図柄／**チェリー**（下段チェリー） | **右リール中段にボーナス図柄**。中リール中段にはボーナス図柄を止めない | 100% |
| 中段チェリー | ボーナス図柄／**チェリー**／ベル（中段チェリー） | 右下がりにボーナス図柄が揃う（中中段・右下段） | 100% |
| 弱スイカ | スイカ／ベル／リプレイ | 右下がりにスイカ揃い | 100% |
| 強スイカA | スイカ／ベル／リプレイ | 上段平行にスイカ揃い | 50% |
| 強スイカB | リプレイ／スイカ／ベル | 中段平行にスイカ揃い | 50% |
| チャンス目A | ベル／リプレイ／ボーナス図柄（下段ボーナス図柄） | ベルが V字（左上段・中下段・右上段） | 50% |
| チャンス目B | スイカ／ベル／リプレイ | 右下がりにスイカテンパイ、右リール中段にスイカ（右下段にボーナス図柄） | 50% |

- 前の版の「強チェリーは左リールの中段」から、仕様書の形に変わりました。
  - 今は、左リールの中段にチェリーが止まるのは**中段チェリー**です。
  - 強チェリーと弱チェリーは、右リール中段にボーナス図柄があるかどうかで見分けます。
- 中段チェリーの右下がりのボーナス図柄は、出目で、入賞ではありません。

## 3. 通常時

### 3-1. ステージ（決定）

液晶には摩天楼の**今いる階**を出します。階で内部状態がわかります。

```mock
stage-low 低確：1〜10階（明るいロビー）。左下でふるカワがナビをする
stage-high 高確：11階以上（夕方）。奥に住み着いた敵の影
stage-super 超高確：22階（ダイシの間）。夜で、奥に四天王の影
stage-maou 超高確：56階（大魔王の間）
```

| 内部状態 | ステージ（階） | 見た目（案） |
|---|---|---|
| 低確 | 1〜10階 | 明るいロビー・下の階 |
| 高確 | 11階以上（22・33・44・55・56階は除く） | 夕方。窓の外が高くなる |
| 超高確 | 22・33・44・55階（四天王）、56階（大魔王ASO） | 夜。その階の四天王・魔王の影が奥に見える |
| 前兆 | 摩天楼中間階層（前兆専用） | 3-4 を参照 |

- 決定：**ふるカワがステージのナビ役**です（前作から続投）。案：左下に出て、階の説明などをしゃべります。
- 決定：**階の表示で状態が確定します**（ずれることはありません）。
- 仕様書：AT 中も低確・高確・超高確があります。
  - 案：AT 中は階を出さず、こおりバトルRASH の画面のままにします（状態は見せない）。
- 内部：階は内部処理が状態に合わせて決めます。
- 案：状態が変わったときやレア役のあとに、エレベーターで階が動く演出を出します。
- 案：高確・超高確からハズレで転落したときは、エレベーターで下の階へ戻ります。

### 3-2. 魔天ゾーン（決定）

- ゾーン（0・100・…・700G）に入っている間は、**画面のまわりに黒い靄**が出ます。
- 内部：ゾーンの出入りはイベントで伝えます。

```mock
zone-maten 魔天ゾーン：画面のまわりに黒い靄
```

- 仕様書：ゾーンの開始G に着いたら、当たりでもハズレでも**必ず前兆（30〜40G）に入ります**（ガセ前兆の発生率 100%）。
- 仕様書で「演出担当と詰めること」になっています：靄を**モードに関係なく 100G ごとに出すか**（8章の質問）。

### 3-3. 天国の示唆（決定）

天国にいるときは、次のカットインが出るようになります。

- シーシャ・ナイテイ・ナイナイ
- シーシャ・ナイテイ・アルアル

```mock
heaven-naitei ナイナイのカットイン
heaven-aruaru アルアルのカットイン（案：アルアルのほうが期待度が高い）
```

- 仕様書：天国は 100G 以内に当たります。前兆の始まりは 0G 煽り（50%）か 50G 煽り（50%）です。超天国は 50G 以内で、0G 煽りだけです。
- 仕様書：ふつうのモードには 50G から始まるゾーンがないので、**50G からの煽りは天国確定**です。
  - 案：50G で魔天ゾーンの靄が出たら、ナイナイかアルアルのカットインも出して、天国確定を知らせます。

### 3-4. 前兆（決定）

1. 前兆（30〜40G）に入ると、ステージが**摩天楼中間階層**に移ります。
2. 中間階層では**ライバルチームとのバトル**になります（連続演出）。
3. 最後に、相手チームを倒せば**ボーナス確定**、倒せなければ**ガセ**です。
4. 本物の前兆とガセ前兆は、途中まで同じ見た目です。

```mock
zencho-battle 中間階層でライバルチームと対決（例：チーム5DX）
zencho-win 撃破 → ボーナス確定。そろえる図柄を出す
zencho-lose 撃破ならず（ガセ）。例：チームASK-3 に負けた
```

- 決定：ライバルチームの強さは **5DX → ASK-3 → お願いマッスル** の順に上がり、**お願いマッスルがいちばん強い**。
- 決定：**お願いマッスルが出たら熱い**（期待度は 5DX ＜ ASK-3 ＜ お願いマッスル）。
- 案：バトルの流れ
  1. 中間階層に入る
  2. 相手チームが登場（出たチームで期待度がわかる）
  3. 連続演出（1戦目・2戦目・3戦目のように数回の勝負）
  4. 最後のゲームで決着
- 内部：相手チーム・連続演出の回数・期待度の演出は内部処理が抽選します。
- 仕様書：前兆中は中間階層にいるので、**高確・超高確かどうかはわかりません**。
- 仕様書：ガセ前兆の途中でレア役からボーナスに当たると、その前兆が本物に変わり、前兆の終わりで当たります。
  - 案：見た目は変えず、そのままバトルで勝ちます。

// ドット絵と画面イメージ (src/presentation/art と tools/design/mockups.js をまとめたもの)
const Art = (() => {
// ----- src/presentation/art/pixel.js -----
// =====================================================================
// ドット絵の共通の道具
// ---------------------------------------------------------------------
// 絵は「1ドット単位の矩形 r(x, y, w, h, 色) を重ねて描く関数」で表す (パチンコ版と同じ書き方)。
// 文字列のドット絵 (1文字 = 1ドット、パレットで色を割り当てる。'.' は透明) も fromRows で同じ形にできる。
// =====================================================================

// 文字列のドット絵を r(...) で描く関数にする
function fromRows(palette, rows) {
    return r => rows.forEach((row, y) => {
        for (let x = 0; x < row.length; x++) {
            const color = palette[row[x]];
            if (color) r(x, y, 1, 1, color);
        }
    });
}

// 3x5 ドットの小さい文字 (図柄・胸のプレートなどに使う)
const GLYPHS = {
    A: ['.#.', '#.#', '###', '#.#', '#.#'],
    E: ['###', '#..', '##.', '#..', '###'],
    K: ['#.#', '#.#', '##.', '#.#', '#.#'],
    M: ['#.#', '###', '#.#', '#.#', '#.#'],
    O: ['###', '#.#', '#.#', '#.#', '###'],
    P: ['##.', '#.#', '##.', '#..', '#..'],
    R: ['##.', '#.#', '##.', '#.#', '#.#'],
    S: ['###', '#..', '###', '..#', '###'],
    4: ['#.#', '#.#', '###', '..#', '..#']
};

// 3x5 の文字を並べて描く。scale はドットの大きさ (1 で 1ドット)
function glyphText(r, text, x, y, color, scale = 1) {
    [...text].forEach((ch, i) => {
        (GLYPHS[ch] || []).forEach((row, gy) => {
            for (let gx = 0; gx < 3; gx++) {
                if (row[gx] === '#') r(x + (i * 4 + gx) * scale, y + gy * scale, scale, scale, color);
            }
        });
    });
}

// 絵を ctx に描く。(x, groundY) は足元の真ん中。
// flip: 左右反転 / silhouette: 黒い影 / tint: 全部をこの色で塗る (白く光る・金色に光るなど) / alpha: 透明度
function drawArt(ctx, art, x, groundY, { scale = 2, frame = 0, flip = false, silhouette = false, tint = null, alpha = 1 } = {}) {
    const left = Math.round(x - (art.w * scale) / 2);
    const top = Math.round(groundY - art.h * scale);
    ctx.save();
    ctx.globalAlpha *= alpha;
    art.draw((rx, ry, rw, rh, color) => {
        const fx = flip ? art.w - rx - rw : rx;
        const x0 = Math.round(left + fx * scale), x1 = Math.round(left + (fx + rw) * scale);
        const y0 = Math.round(top + ry * scale), y1 = Math.round(top + (ry + rh) * scale);
        ctx.fillStyle = silhouette ? '#101018' : tint || color;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }, frame);
    ctx.restore();
}

// 文字列のドット絵 (こおりくん・ともいし・ふるカワ) を r(...) の形にする
function stringArt(id, frame0, frame1) {
    const s = STRING_SPRITES[id];
    const rows = s.frames[frame0];
    const art = [fromRows(s.palette, rows), fromRows(s.palette, s.frames[frame1])];
    return { w: rows[0].length, h: rows.length, draw: (r, frame) => art[frame ? 1 : 0](r) };
}

// 図柄を ctx に描く。(x, y) は左上、size は描く大きさ (ドット数 32 の倍数だときれい)
function drawSymbol(ctx, id, x, y, size = 32) {
    const k = size / 32;
    const r = (rx, ry, w, h, color) => {
        ctx.fillStyle = color;
        const x0 = Math.round(x + rx * k), y0 = Math.round(y + ry * k);
        ctx.fillRect(x0, y0, Math.round(x + (rx + w) * k) - x0, Math.round(y + (ry + h) * k) - y0);
    };
    const disc = (cx, cy, rad, color) => {
        for (let dy = -rad; dy <= rad; dy++) {
            const half = Math.round(Math.sqrt(rad * rad - dy * dy));
            r(cx - half, cy + dy, half * 2, 1, color);
        }
    };
    SYMBOL_ART[id](r, disc);
}

// 液晶の絵の道具 (文字・背景・キャラ・カットイン・リールの絵など)
// ---------------------------------------------------------------------
// 液晶は 320x180 ドットで描き、表示するときに拡大する。
// ゲームの液晶 (lcd/scenes.js) と、画面設計書の画面イメージ (tools/design/mockups.js) の両方で使う。

const W = 320, H = 180, GROUND = 150;
const DISPLAY = '"Dela Gothic One", "Yu Gothic", sans-serif';
const BODY = '"Zen Kaku Gothic New", "Yu Gothic", sans-serif';
const RAINBOW = ['#ff3040', '#ff9a20', '#ffe040', '#40d060', '#30a0ff', '#8050ff'];

// ----- 道具 -----
function seeded(seed) {
    return () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
    };
}

function ch(ctx, id, x, ground, opts = {}) {
    drawArt(ctx, ART[id], x, ground, opts);
}

// weight: 太さ ('700' など。BODY の字を太くするとき)
function text(ctx, s, x, y, { size = 14, color = '#ffffff', stroke = '#000000', lw = 3, align = 'center', font = DISPLAY, weight = '' } = {}) {
    ctx.save();
    ctx.font = `${weight} ${size}px ${font}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = lw;
        ctx.strokeText(s, x, y);
    }
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
    ctx.restore();
}

function rainbow(ctx, x0, y0, x1, y1) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    RAINBOW.forEach((c, i) => g.addColorStop(i / (RAINBOW.length - 1), c));
    return g;
}

function vgrad(ctx, y0, y1, stops) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    return g;
}

function rect(ctx, x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
}

function roundRect(ctx, x, y, w, h, rad, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, rad);
    if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
    }
    if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
}

// 放射状の集中線
function rays(ctx, cx, cy, colors, count = 24, alpha = 0.5) {
    ctx.save();
    ctx.globalAlpha = alpha;
    for (let i = 0; i < count; i++) {
        const a0 = (i / count) * Math.PI * 2, a1 = a0 + Math.PI / count;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a0) * 400, cy + Math.sin(a0) * 400);
        ctx.lineTo(cx + Math.cos(a1) * 400, cy + Math.sin(a1) * 400);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
    }
    ctx.restore();
}

// 摩天楼の部屋。sky: 窓の外の色 (上→下) / wall・floor: 壁と床の色
function room(ctx, { sky, wall, floor, cityColor = '#1a2230', lights = '#ffe9a0', stars = false }) {
    rect(ctx, 0, 0, W, H, wall);
    const rnd = seeded(11);
    for (let i = 0; i < 4; i++) {
        const x = 12 + i * 76, y = 14, w = 68, h = 104;
        rect(ctx, x, y, w, h, vgrad(ctx, y, y + h, sky));
        if (stars) for (let s = 0; s < 8; s++) rect(ctx, x + rnd() * w, y + rnd() * 50, 1, 1, '#ffffff');
        // 窓の下に見える街
        for (let bx = x; bx < x + w; bx += 6 + Math.floor(rnd() * 6)) {
            const bh = 10 + rnd() * 30;
            rect(ctx, bx, y + h - bh, 5, bh, cityColor);
            for (let ly = y + h - bh + 3; ly < y + h - 2; ly += 4) if (rnd() < 0.35) rect(ctx, bx + 1, ly, 1, 1, lights);
        }
        rect(ctx, x + w / 2 - 1, y, 2, h, 'rgba(0,0,0,.35)');
        ctx.strokeStyle = 'rgba(0,0,0,.6)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
    }
    rect(ctx, 0, 124, W, 4, 'rgba(0,0,0,.35)');
    rect(ctx, 0, 128, W, H - 128, vgrad(ctx, 128, H, floor));
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    for (let x = -160; x < W + 160; x += 32) {
        ctx.beginPath();
        ctx.moveTo(W / 2 + (x - W / 2) * 0.35, 128);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
}

// 左上の階の表示
function floorTag(ctx, label, sub, color = '#8fd6f7') {
    ctx.save();
    ctx.font = `13px ${DISPLAY}`;
    const lw = ctx.measureText(label).width;
    ctx.font = `9px ${BODY}`;
    const sw = sub ? ctx.measureText(sub).width + 10 : 0;
    ctx.restore();
    roundRect(ctx, 6, 6, lw + 16 + sw, 22, 3, 'rgba(5,10,16,.85)', color);
    text(ctx, label, 14, 17.5, { size: 13, color, stroke: null, align: 'left' });
    if (sub) text(ctx, sub, 14 + lw + 8, 17.5, { size: 9, color: '#e8f6ff', stroke: null, font: BODY, align: 'left' });
}

// ふるカワのナビ (左下に小さく出て、吹き出しでしゃべる)
function navi(ctx, line) {
    ch(ctx, 'furukawa', 22, 176, { scale: 2 });

    const w = Math.min(250, ctx.measureText(line).width + 16);
    roundRect(ctx, 44, 140, w, 22, 6, 'rgba(255,255,255,.94)', '#ff4f8b');
    ctx.beginPath();
    ctx.moveTo(44, 154);
    ctx.lineTo(38, 158);
    ctx.lineTo(46, 150);
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.fill();

// 黒い靄 (魔天ゾーン)
function haze(ctx) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 210);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.6, 'rgba(8,0,14,.55)');
    g.addColorStop(1, 'rgba(4,0,8,.97)');
    rect(ctx, 0, 0, W, H, g);
    const rnd = seeded(5);
    for (let i = 0; i < 46; i++) {
        const t = rnd();
        const side = Math.floor(rnd() * 4);
        const x = side === 0 ? t * W : side === 1 ? W : side === 2 ? t * W : 0;
        const y = side === 0 ? 0 : side === 1 ? t * H : side === 2 ? H : t * H;
        ctx.beginPath();
        ctx.arc(x, y, 10 + rnd() * 22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${10 + rnd() * 20},0,${20 + rnd() * 20},.5)`;
        ctx.fill();
    }
}

// カットイン (斜めの帯にキャラの顔と文字)
function cutin(ctx, y, h, color, id, line, { scale = 3, flip = false, textColor = '#ffffff' } = {}) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, y + 10);
    ctx.lineTo(W, y);
    ctx.lineTo(W, y + h - 10);
    ctx.lineTo(0, y + h);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.clip();
    ctx.globalAlpha = 0.25;
    for (let i = -10; i < 40; i++) rect(ctx, i * 12, y, 4, h, '#ffffff');
    ctx.globalAlpha = 1;
    ch(ctx, id, 70, y + h + ART[id].h * scale * 0.35, { scale, flip });
    ctx.restore();
    text(ctx, line, 210, y + h / 2, { size: 18, color: textColor, lw: 4 });
}

// リール (3段 x 3リール)。grid[段][リール] は図柄の id
function reels(ctx, x, y, cell, grid, { line = null } = {}) {
    for (let i = 0; i < 3; i++) {
        const rx = x + i * (cell + 8);
        rect(ctx, rx - 2, y - 2, cell + 4, cell * 3 + 4, '#0a0e14');
        rect(ctx, rx, y, cell, cell * 3, vgrad(ctx, y, y + cell * 3, ['#c8ccd4', '#ffffff', '#ffffff', '#c8ccd4']));
        for (let row = 0; row < 3; row++) {
            const id = grid[row][i];
            if (id) drawSymbol(ctx, id, rx + cell * 0.1, y + row * cell + cell * 0.1, cell * 0.8);
        }
    }
    if (line) {
        ctx.save();
        ctx.strokeStyle = line;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.moveTo(x - 6, y + cell * 1.5);
        ctx.lineTo(x + cell * 3 + 22, y + cell * 1.5);
        ctx.stroke();
        ctx.restore();
    }
}

// 小さいリールの出目 (レア役の図に使う)。mark: 光らせる位置 [[段, リール], ...]
function miniReels(ctx, x, y, grid, mark = [], cell = 18) {
    rect(ctx, x - 3, y - 3, cell * 3 + 10, cell * 3 + 6, '#0a0e14');
    for (let i = 0; i < 3; i++) {
        const rx = x + i * (cell + 2);
        rect(ctx, rx, y, cell, cell * 3, '#f4f6f8');
        for (let row = 0; row < 3; row++) {
            if (mark.some(([mr, mi]) => mr === row && mi === i)) rect(ctx, rx, y + row * cell, cell, cell, '#ffe680');
            const id = grid[row][i];
            if (id) drawSymbol(ctx, id, rx + 1, y + row * cell + 1, cell - 2);
        }
    }
}

// PUSH ボタン。fill: 色 (グラデーションも可) / pop: 飛び出し
function pushButton(ctx, cx, cy, rad, fill, { pop = false, label = 'PUSH' } = {}) {
    if (pop) {
        rect(ctx, cx - rad * 0.7, cy, rad * 1.4, rad * 0.9, '#3a3a44');
        cy -= rad * 0.7;
    }
    ctx.beginPath();
    ctx.arc(cx, cy + 3, rad + 3, 0, Math.PI * 2);
    ctx.fillStyle = '#20242c';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, rad, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx - rad * 0.3, cy - rad * 0.35, rad * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fill();
    text(ctx, label, cx, cy + 1, { size: rad * 0.42, color: '#ffffff', lw: 2.5, stroke: 'rgba(0,0,0,.55)' });
}

// 上乗せの場面: 攻撃するキャラ・相手・ゲーム数
function attackScene(ctx, attacker, enemy, plus, extra) {
    room(ctx, { sky: ['#1a1030', '#4a2a6a'], wall: '#2a2238', floor: ['#3a3048', '#1a1424'], stars: true });
    rect(ctx, 0, 0, W, H, 'rgba(10,0,30,.35)');
    rays(ctx, 220, 110, ['#ffffff', 'rgba(255,255,255,0)'], 30, 0.18);
    ch(ctx, enemy, 230, GROUND, { scale: ART[enemy].w > 40 ? 1.6 : 2, tint: '#ffffff', alpha: 0.35 });
    ch(ctx, enemy, 234, GROUND, { scale: ART[enemy].w > 40 ? 1.6 : 2 });
    ch(ctx, attacker, 100, 146, { scale: attacker === 'koori' ? 3 : 2.2, flip: attacker === 'onioni' });
    // 当たった光
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2, rr = i % 2 ? 10 : 24;
        ctx.lineTo(205 + Math.cos(a) * rr, 105 + Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = '#fff6b0';
    ctx.fill();
    ctx.restore();
    plusGames(ctx, plus);
    if (extra) extra();
    rect(ctx, 0, 0, W, 16, 'rgba(0,0,0,.6)');
    text(ctx, 'こおりバトルRASH', 8, 8.5, { size: 9, align: 'left', stroke: null, color: '#8fd6f7' });
    text(ctx, '残り 37G', W - 8, 8.5, { size: 9, align: 'right', stroke: null });
}

// AT の背景 (疾走感のある青い線)
function atBackground(ctx) {
    rect(ctx, 0, 0, W, H, vgrad(ctx, 0, H, ['#061a3a', '#0b3a78', '#0a1a30']));
    const rnd = seeded(3);
    for (let i = 0; i < 40; i++) rect(ctx, rnd() * W, rnd() * 130, 20 + rnd() * 60, 1, 'rgba(140,215,250,.45)');
    rect(ctx, 0, 130, W, 50, vgrad(ctx, 130, H, ['#122a4a', '#060e1a']));
}

// ASO摩天楼のシルエット
function tower(ctx, cx, base, height, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx - 40, base);
    ctx.lineTo(cx - 28, base - height * 0.7);
    ctx.lineTo(cx - 18, base - height * 0.9);
    ctx.lineTo(cx, base - height);
    ctx.lineTo(cx + 18, base - height * 0.9);
    ctx.lineTo(cx + 28, base - height * 0.7);
    ctx.lineTo(cx + 40, base);
    ctx.fill();
}

function flames(ctx, cx, ground, colorFn) {
    const rnd = seeded(21);
    for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        const x = cx + Math.cos(a) * 70, y = ground - 46 + Math.sin(a) * 40;
        const h = 18 + rnd() * 16;
        ctx.beginPath();
        ctx.moveTo(x - 7, y + 8);
        ctx.quadraticCurveTo(x - 4, y - h * 0.4, x, y - h);
        ctx.quadraticCurveTo(x + 4, y - h * 0.4, x + 7, y + 8);
        ctx.fillStyle = colorFn(i);
        ctx.fill();
    }
}

// キャラクター1人の絵 (キャラ設計書のカード)
function drawCharacterCard(ctx, id, w, h) {
    const art = ART[id];
    const scale = Math.min((w - 8) / art.w, (h - 8) / art.h, 3);
    drawArt(ctx, art, w / 2, h - 4, { scale });
}

return { SCENES, CHARACTERS, drawCharacterCard };

<script>
(function () {
  // 画面イメージの文字に使う字を先に読み込む (Google Fonts は使う字だけを読み込むため、canvas に描く前に要る)
  const GLYPHS = 'こおりくんばきつよめ前作にやすさたむだけふるカワナビともいしかがっぱチームひびまぅ新シバタ願マッスルウエノブイケキハリ住み着敵浦の島重蔵コン奈架多ドラゴ金面犬ダ四天王ズミニヤゾ大魔ャ・テ国井アベプレェト残▲ロは階。下弱！夕方回廊…ら上高確間気配内定知せ兄出番な到達摩楼中層現戦目撃破ず青「ぞ」緑赤勝激ツ虹て通常飛解説氷ュ体を持主人公借返、財宝ねう獲得枚ジ山口福岡境突然れ塔〜低超第話今月済？狙え終わ継続了復活次セへボ押順オソ長絶対殺剣×利特化★ク液晶一瞬止あ褒美合計腸炎選で結果発表ご乗◀停ぶ▶決総数ゲ最デフォ奇示唆偶設以全員集（）強段冒険～凶挑兆ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-!';
  const fontsReady = (() => {
    const probe = document.createElement('div');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;white-space:nowrap';
    ['Dela Gothic One', 'Zen Kaku Gothic New'].forEach(f => {
      const s = document.createElement('span');
      s.style.fontFamily = `"${f}"`;
      s.textContent = GLYPHS;
      probe.appendChild(s);
    });
    document.body.appendChild(probe);
    const timeout = new Promise(res => setTimeout(res, 4000));
    return Promise.race([document.fonts.ready, timeout]).then(() => document.fonts.ready).catch(() => {});
  })();

  function sizedCanvas(w, h, cssW) {
    const c = document.createElement('canvas');
    const k = 2 * (window.devicePixelRatio || 1);
    c.width = w * k; c.height = h * k;
    c.style.maxWidth = cssW + 'px';
    c.style.aspectRatio = w + ' / ' + h;
    const ctx = c.getContext('2d');
    ctx.scale(k, k);
    return { c, ctx };
  }

  // ```mock <id> <説明>``` → 画面イメージ、```chars <id> <id> ...``` → キャラのカード
  function figures(root) {
    const jobs = [];
    root.querySelectorAll('pre > code.language-mock').forEach(code => {
      const lines = code.textContent.trim().split('\n');
      const row = document.createElement('div');
      row.className = lines.length > 1 ? 'mock-row' : '';
      lines.forEach(line => {
        const m = line.trim().match(/^(\S+)\s*(.*)$/);
        const scene = m && Art.SCENES[m[1]];
        if (!scene) return;
        const fig = document.createElement('figure'); fig.className = 'mock';
        const { c, ctx } = sizedCanvas(scene.w, scene.h, scene.w * 2);
        fig.appendChild(c);
        if (m[2]) { const cap = document.createElement('figcaption'); cap.textContent = m[2]; fig.appendChild(cap); }
        row.appendChild(fig);
        jobs.push(() => { ctx.save(); scene.draw(ctx); ctx.restore(); });
      });
      const pre = code.parentNode;
      if (row.className) pre.replaceWith(row); else pre.replaceWith(...row.childNodes);
    });
    root.querySelectorAll('pre > code.language-chars').forEach(code => {
      const grid = document.createElement('div'); grid.className = 'chars';
      code.textContent.trim().split(/\s+/).forEach(id => {
        const info = Art.CHARACTERS.find(x => x.id === id);
        if (!info) return;
        const card = document.createElement('div'); card.className = 'card';
        const { c, ctx } = sizedCanvas(56, 56, 112);
        card.appendChild(c);
        card.insertAdjacentHTML('beforeend',
          `<div class="nm">${info.name}</div><div class="gp">${info.group}</div>` +
          (info.origin === '新' ? '<div class="new">新キャラ（Claude の案）</div>' : ''));
        grid.appendChild(card);
        jobs.push(() => Art.drawCharacterCard(ctx, id, 56, 56));
      });
      code.parentNode.replaceWith(grid);
    });
    fontsReady.then(() => jobs.forEach(j => j()));
  }

  const docs = {
    screen: document.getElementById('md-screen').textContent,
    chars: document.getElementById('md-chars').textContent
  };
  const files = { 'screen-design.md': 'screen', 'characters.md': 'chars' };
  const art = document.getElementById('doc');
  const toc = document.getElementById('toc');

  // 「決定」「案」「内部」で始まる文やかっこ書きを色つきの印にする
  function chips(html) {
    const kind = { '決定': 'd', '仕様書': 's', '案': 'i', '内部': 'n' };
    html = html.replace(/(>|^)\s*(決定|仕様書|案|内部)：/g, (m, a, k) => `${a}<span class="chip ${kind[k]}">${k}</span>`);
    html = html.replace(/（決定・仕様書）/g, ' <span class="chip d">決定</span><span class="chip s">仕様書</span>');
    html = html.replace(/（(決定|仕様書|案|内部)(：([^）<]*))?）/g, (m, k, _, rest) =>
      ` <span class="chip ${kind[k]}">${k}${rest ? '：' + rest : ''}</span>`);
    return html;
  }

  function slug(text, i) { return 'sec-' + i; }

  function render(key, hash) {
    let html = chips(marked.parse(docs[key]));
    art.innerHTML = html;
    figures(art);
    art.querySelectorAll('table').forEach(t => {
      const box = document.createElement('div'); box.className = 'tbl';
      t.parentNode.insertBefore(box, t); box.appendChild(t);
    });
    // 「決めてほしいこと」の章を枠で囲む
    const heads = [...art.querySelectorAll('h2')];
    heads.forEach(h => {
      if (!h.textContent.includes('決めてほしいこと')) return;
      const box = document.createElement('section'); box.className = 'ask';
      h.parentNode.insertBefore(box, h);
      let n = h; const move = [];
      while (n && !(n !== h && n.tagName === 'H2')) { move.push(n); n = n.nextElementSibling; }
      move.forEach(x => box.appendChild(x));
    });
    // 版の行は小さく
    art.querySelectorAll('p').forEach(p => { if (/^版:/.test(p.textContent)) p.className = 'doc-meta'; });
    // 書類どうしのリンクはタブの切り替えにする
    art.querySelectorAll('a[href]').forEach(a => {
      const [file, frag] = a.getAttribute('href').split('#');
      if (files[file]) {
        a.addEventListener('click', e => { e.preventDefault(); select(files[file], frag ? 'h-' + frag : null); });
      }
    });
    toc.innerHTML = '';
    art.querySelectorAll('h2').forEach((h, i) => {
      const raw = h.textContent.replace(/\s+/g, ' ').trim();
      h.id = 'h-' + raw.toLowerCase().replace(/[.\s]+/g, '-').replace(/[（）()「」、。：:]/g, '');
      const a = document.createElement('a'); a.href = '#'; a.textContent = raw;
      a.addEventListener('click', e => { e.preventDefault(); h.scrollIntoView(); });
      toc.appendChild(a);
    });
    const target = hash && (document.getElementById(hash) ||
      [...art.querySelectorAll('h2')].find(h => hash.includes(h.textContent.trim().split(/\s/)[0].replace('.', ''))));
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  function select(key, hash) {
    document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.doc === key)));
    art.setAttribute('aria-labelledby', 'tab-' + key);
    render(key, hash);
    try { localStorage.setItem('aso-doc-tab', key); } catch (e) {}
  }

  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => select(b.dataset.doc)));
  let start = location.hash === '#chars' ? 'chars' : 'screen';
  if (!location.hash) { try { start = localStorage.getItem('aso-doc-tab') === 'chars' ? 'chars' : 'screen'; } catch (e) {} }
  select(start);

  // 目次の今いる章
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const i = [...art.querySelectorAll('h2')].indexOf(e.target);
    toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('on', i === j));
  }), { rootMargin: '0px 0px -70% 0px' });
  const observe = () => { io.disconnect(); art.querySelectorAll('h2').forEach(h => io.observe(h)); };
  observe();
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', observe));

  // ヘッダーの黒い摩天楼と氷の粒
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  function sky() {
    const w = cv.clientWidth, h = cv.clientHeight, r = window.devicePixelRatio || 1;
    cv.width = w * r; cv.height = h * r; ctx.scale(r, r);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let x = 0; x < w; ) {
      const bw = 18 + rnd() * 40, bh = h * (0.25 + rnd() * 0.6);
      ctx.fillStyle = '#1a2430'; ctx.fillRect(x, h - bh, bw, bh);
      ctx.fillStyle = 'rgba(140,215,250,.35)';
      for (let y = h - bh + 6; y < h - 6; y += 9) for (let wx = x + 4; wx < x + bw - 4; wx += 7) if (rnd() < .22) ctx.fillRect(wx, y, 2, 3);
      x += bw + 2;
    }
    const tx = w * 0.82, th = h * 0.95;
    ctx.fillStyle = '#26323f'; ctx.beginPath(); ctx.moveTo(tx - 34, h); ctx.lineTo(tx - 22, h - th); ctx.lineTo(tx, h - th - 14); ctx.lineTo(tx + 22, h - th); ctx.lineTo(tx + 34, h); ctx.fill();
    ctx.fillStyle = '#d8f3ff';
    for (let i = 0; i < 60; i++) ctx.fillRect(rnd() * w, rnd() * h * .7, 1.5, 1.5);
  }
  sky(); window.addEventListener('resize', () => { ctx.setTransform(1,0,0,1,0,0); sky(); });
})();

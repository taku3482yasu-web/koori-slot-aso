石の川にあった石が急激に冷えたことで生まれた。
その際に誰かの大腸炎が体の中に潜り込んでしまったため、大腸炎と共生している。毎日の大腸炎とのおしゃべりは欠かさない。

おにおにに借りたお金が返せず、パンツを見せる危機に。財宝を手に入れて借金を返すため、仲間を連れて ASO摩天楼に挑む。

内定はまだない。`},onioni:{title:"SE城の主",text:`遠賀川近辺を支配する鬼で、SE城の主。
睡眠時間は１日１７時間と、鬼としては規則正しい生活をしている。

こおりくんに貸した３万６千円を返してもらうまで、見張りとして摩天楼についてきた。
CS城の主 KING.ASAHARA とは長年のライバル。

こおりくんの顔はむかつくが、いざというときは誰よりも頼りになる。`},yasu:{title:"やすです。",text:`そこら辺をうろついていた一般人。

こおりくんに急にじゃんけんを挑まれて負けたため、摩天楼についていくことになった。
必殺技は「やすパンチ」。`},tamu:{title:"たむです。",text:`音ゲーをしていた一般人。

前にこおりくんを音ゲー勝負でぼこぼこにして泣かせたことがある。
今回は「面白そうやし、暇つぶしにもなるでしょ」と摩天楼についてきた。
必殺技は「たむキック」。`},dake:{title:"だけです。",text:`鍛えていた一般人。
世間という荒波にのまれた結果、肉体改造を施し、今の身体になった。

鍛えた地獄耳でこおりくんの話を聞きつけ、摩天楼についてきた。
必殺技は鍛え上げたこぶしの「だけチョップ」。`},furukawa:{title:"みんなを見守る妖精の類",text:`小さな妖精。こおりくんをサポートしている。
摩天楼のことに詳しく、階の案内をしてくれる。
戦闘力は貧弱。

実家が太いとのうわさがあり、若干周りを下に見ている節がある。`},tomoishi:{title:"こおりくんのお母さん",text:`こおりくんをとても愛している。

しかし、こおりくんが内定を持っていなかったり、人のお金を返さなかったりするので、いつも心配している。
口ぐせは「こおりなにしよっと！」。`},okagappa:{title:"丘に上がったカッパ",text:`丘に進出したカッパ。チーム5DX のリーダー。
ＤＪをしており、山グッチのおかピポとして名も知られている。

ノリと勢いで生きており、お宝を狙ってノリで摩天楼に来た。
必殺技は「おかピポっと光線」。`},hibikimakuri:{title:"響きを伝える妖怪",text:`はるか昔から伝わる古典妖怪。
広い部屋などで声や物音が響いたりするのはこいつのせい。

最近は４ＤＸにはまっており、摩天楼はよく響くのでお気に入り。
必殺技は「大音響4DX」。`},yamamou:{title:"牛にあこがれる青年",text:`チーム5DX のメンバー。
牛にあこがれていて、どんなときも牛へのリスペクトを欠かさない。

おちょくられるのが大嫌い。
必殺技は「おちょくりボーンフィーバー」。`},asahara:{title:"CS城の主",text:`チームASK-3 のリーダーで、CS城の主。SE城の主おにおにとはライバル。

プライドが高く、思い通りに事が進まないとかんしゃくを起こす。
優秀な策略家でもあり、優秀な者を仲間に引き入れたり、敵を欺いたりするのが得意。これまで陥落させた城は数知れない。

必殺技は一撃で相手を屠る「DOPAPANCHI」。`},kotani:{title:"KING.ASAHARA の腹心",text:`チームASK-3 の頭脳。
クリップボードをいつも持っている。
この20年間、遅刻・欠席を一度もしたことがない。

数字だけを信じるタイプで、何でも確率で言う。
必殺技は「NABIテンポ」。`},sasaki:{title:"イケてる社員",text:`チームASK-3 のメンバー。シゴできお兄さん。

仕事を一人でこなしすぎて疲れているのか、「すごいです。」「やばいです。」など語彙が死ぬ時がある。
口ぐせは「締め切り厳守です。」
必殺技は「ASAスラッシュ」。`},shibata:{title:"おはしばた",text:`現代に名をはせるユーチューバー兼プロレスラー。
自身のプロレス動画をユーチューブンにアップして小銭を稼いでいる。
摩天楼でも撮れ高を探している。

たまに「んな～」と鳴く。
必殺技は「シバタードライバー」。`},ueno:{title:"筋肉の貴族",text:`オープンキャンパスクラブ会長のナカツォー家の主。
筋肉をこよなく愛し、1日26時間を筋肉を磨くトレーニングにあてている。

愛妻家で、妻にプレゼントする黄金のネックレスを手に入れるために摩天楼に来た。
必殺技は「マッスルウエノクラッシュ」。`},ikekimu:{title:"アイドル兼盗賊",text:`表の顔はアイドルユニット「out my back mans」のメンバー。
裏の顔は、裏の世界で有名な盗賊一家の長男。これまで盗んだものは数知れず、暗殺術にたけている。

パニックになると、よくわからない言葉を口にすることがある。
必殺技は「イケキムドライブ」。`},harry:{title:"縄張りのハリネズミ",text:`摩天楼に住み着いたハリネズミ。
ビビりで人前に出るのが苦手だが、縄張り意識が強く、縄張りに入られると舌打ちしながら襲ってくる。

人の言葉を少し話せる。「ハリー！」「メンキョナイー！」`},urashima:{title:"帰れなくなった釣り人",text:`一人で摩天楼に挑戦したが、道に迷って帰れなくなり、摩天楼の中に家を建てて暮らしている。
今はダイシの従者。

摩天楼で鍛えられ、亀の甲羅で守り、玉手箱で煙幕を放って戦う。
物忘れがひどく語彙も少ないので、何を話しているのか解読するのが難しい。`},makibikon:{title:"迎撃 AI ロボット",text:`摩天楼の中に放たれた、AI を積んだロボット。
体にさまざまな武器を仕込んでいて、挑戦者を迎え撃つ。

語尾は「〜あります」。礼儀正しく、語彙が多く、とても賢い AI を使っている。`},nakata:{title:"大魔王のペット",text:`大魔王が育てているペット。摩天楼の挑戦者を何度も葬ってきた最強のドラゴン。
口から水のブレスを吐き、しっぽの一撃で屈強な者も消し飛ばす。

最近は何でも壊すようになったので、介護の勉強をして力加減を学んでいる。`},goldDog:{title:"黄金の番犬",text:`全身が金色の犬。この犬が触れたものは黄金になる。
摩天楼に住み着いた敵の中でいちばん強い。

３食昼寝付きの生活を謳歌しているが、挑戦者を黄金像にしてトイレの置物にしてやろうと襲ってくる。`},daishi:{title:"四天王 22階",text:`四天王の1人。有名な和尚で、いろいろな所に出向いてお経をあげてきた。
仏の顔と鬼の顔をあわせ持ち、鬼になると戦闘力は計り知れない。

最近はネットの世界を救おうと「ネット寺」を立ち上げた。`},zumitani:{title:"四天王 33階",text:`古くから続くズミタニ家の忍者で、77代目。
すばやい動きで敵を翻弄し、マキビコンMk-4 を大量に呼び出す。

口調は明るいが、言葉のふしぶしにとげがある。`},runaya:{title:"四天王 44階",text:`大魔法使いで、摩天楼を作ったのは彼女。摩天楼の形を自由自在に変えられる。
月の魔術を使い、月の力をこめたビームを放つ。

心配性なのか、同じことを何度も話そうとする癖がある。`},nozoema:{title:"四天王最強 55階",text:`四天王最強。圧倒的な力を秘め、刀の一振りで、立ちふさがるものは何であろうと切り伏せる。

鎧の中にはたくましい筋肉が隠れていて、毎日の日課は鏡に向かって自分の筋肉を見せつけること。`},maou:{title:"ASO摩天楼の主",text:`数百年前に「ASOの壺」に封印されていたが、封印が解けて現世によみがえった。
力はすさまじく、無から宝や武器などを生み出して使役できる。

摩天楼を築き、自分に立ち向かう挑戦者を待ちわびている。
必殺技は「亜祖宇激烈破」。`},naitei:{title:"内定の神",text:`内定を統べる内定の神様。
内定を与えるも与えないもこの神次第。

天国にいるときにだけ現れる。天井で現れたら BIG 確定。
双子の兄がいる。`},aruaru:{title:"内定の化身",text:`内定を体現し、内定の理を統べる内定の神。
シーシャ・ナイテイ・ナイナイの兄。
